name: Test DataBroadcaster (Issue #38)

on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches: ["main"]

jobs:
  test-broadcaster:
    runs-on: ubuntu-latest
    env:
      INSTRUMATION_MODE: SIM

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e .

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/instrumation/utils.py tests/test_broadcaster.py

      - name: Run DataBroadcaster tests
        run: |
          pytest tests/test_broadcaster.py -v

      - name: Run full test suite (regression check)
        run: |
          pytest -v
