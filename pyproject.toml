[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instrumation"
version = "0.7.1"
description = "A high-level Hardware Abstraction Layer (HAL) for RF test stations with Digital Twin support."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "abduznik", email = "abduznik@users.noreply.github.com"}
]
keywords = [
    "pyvisa",
    "scpi",
    "rf-testing",
    "hardware-abstraction-layer",
    "test-automation",
    "lab-automation",
    "instrument-control",
    "oscilloscope",
    "spectrum-analyzer",
    "signal-generator",
    "network-analyzer",
    "test-instrumentation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "pyvisa",
    "pyserial",
    "toml",
    "numpy",
    "websockets",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
instrumation = "instrumation.cli:main"

[project.urls]
"Homepage" = "https://github.com/abduznik/instrumation"
"Documentation" = "https://abduznik.github.io/instrumation/"
"Repository" = "https://github.com/abduznik/instrumation"
"Bug Tracker" = "https://github.com/abduznik/instrumation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instrumation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 127
target-version = "py39"

[tool.ruff.lint]
# Matches the previous flake8 hard-fail set: syntax errors and undefined
# names. Style issues (E501, W etc.) remain non-blocking, as before.
select = ["E9", "F63", "F7", "F82"]
